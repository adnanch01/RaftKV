// The wire protocol between Raft nodes.
//
// Raft needs only two RPCs (Section 5 of the Raft paper):
//   * RequestVote   - sent by candidates to gather votes during an election
//   * AppendEntries - sent by the leader to replicate log entries; an
//                     AppendEntries with no entries is a heartbeat
syntax = "proto3";

package raft;

option java_package = "com.raftkv.raft.rpc";
option java_multiple_files = true;

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message LogEntryProto {
  int64 index = 1;   // position in the log, starting at 1
  int64 term = 2;    // term in which the leader created this entry
  bytes command = 3; // opaque command for the state machine (empty = no-op)
}

message RequestVoteRequest {
  int64 term = 1;           // candidate's term
  string candidate_id = 2;  // candidate requesting the vote
  int64 last_log_index = 3; // index of the candidate's last log entry
  int64 last_log_term = 4;  // term of the candidate's last log entry
}

message RequestVoteResponse {
  int64 term = 1;          // voter's currentTerm, so the candidate can update itself
  bool vote_granted = 2;   // true means the candidate received the vote
  string voter_id = 3;
}

message AppendEntriesRequest {
  int64 term = 1;                     // leader's term
  string leader_id = 2;               // so followers can redirect clients
  int64 prev_log_index = 3;           // index of the entry immediately preceding the new ones
  int64 prev_log_term = 4;            // term of the prev_log_index entry
  repeated LogEntryProto entries = 5; // entries to store (empty for heartbeat)
  int64 leader_commit = 6;            // leader's commitIndex
}

message AppendEntriesResponse {
  int64 term = 1;           // follower's currentTerm, so the leader can update itself
  bool success = 2;         // true if the follower had an entry matching prev_log_index/prev_log_term
  string follower_id = 3;
  int64 match_index = 4;    // on success: the highest index known to match the leader's log

  // On failure: hints that let the leader skip back a whole term at a time
  // instead of one entry per round trip (the "fast backup" optimization).
  int64 conflict_index = 5;
  int64 conflict_term = 6;  // 0 if the follower's log is simply too short
}
